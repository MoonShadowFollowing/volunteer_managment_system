spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/vms?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    # ↓ 本机 MySQL root 密码，公开仓库别提交真密码！
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

vms:
  jwt:
    # JWT 密钥，配置项缺省值是 dev 用的别拿去线上
    secret: ${VMS_JWT_SECRET:Z2p4LXZtcy1qd3Qtc2VjcmV0LWRldi0yMDI2LWRvLW5vdC11c2UtaW4tcHJvZA==}
    expiration-hours: 24
    issuer: vms-backend
  seed:
    # 首次启动会灌 ≥200 用户 / ≥100 活动 / ≥2000 报名+签到，用来撑 SRS 的数据规模指标
    # 二次启动检测到 bulk 用户在就跳过，演示完不想再灌可以改 false
    bulk: true
    organizers-target: 14
    volunteers-target: 200
    activities-target: 100
    regs-target: 2000
  upload:
    # 上传文件存哪儿，相对路径就跟着工作目录走；Windows 想绝对路径写 D:/vms-uploads 也行
    dir: ./uploads
    max-mb: 5
