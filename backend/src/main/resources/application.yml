spring:
  profiles:
    active: dev
  application:
    name: vms-backend

  jackson:
    # 全局时间格式 + 国内时区，前后端约好这个 yyyy-MM-dd HH:mm:ss
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  sql:
    init:
      # always 每次启动都会重跑 schema/data.sql
      # 演示时若想保留数据库现状，改成 never 即可
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
      continue-on-error: false
      encoding: UTF-8

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 直接打到 stdout，方便调试。生产记得关
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      # 没启用逻辑删除，DELETE 就是物理删
      # 真要软删的话，按表加 @TableLogic 注解就行，全局别动

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    root: INFO
    edu.scau.vms: DEBUG
    org.springframework.web: INFO
